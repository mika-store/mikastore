<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mika Store</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container" style="max-width:400px;margin:80px auto;">
    <div class="card">
      <h2 style="text-align:center;margin-bottom:24px;">🔐 Login</h2>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email <span class="required">*</span></label>
          <input type="email" id="email" class="form-control" placeholder="admin@mikastore.com" required>
        </div>
        <div class="form-group">
          <label>Password <span class="required">*</span></label>
          <input type="password" id="password" class="form-control" placeholder="********" required>
        </div>
        <div id="loginError" style="display:none;color:var(--danger);margin-bottom:12px;"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Login</button>
        <p style="text-align:center;margin-top:16px;color:var(--gray);">
          Belum punya akun? <a href="/register.html" style="color:var(--primary);font-weight:600;">Daftar</a>
        </p>
      </form>
    </div>
  </div>

  <script>
    const API_URL = 'https://mika-store-backend.onrender.com/api';

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');
      
      errorDiv.style.display = 'none';
      
      try {
        const response = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (data.status === 'success') {
          window.location.href = '/';
        } else {
          errorDiv.textContent = data.message || 'Login gagal';
          errorDiv.style.display = 'block';
        }
      } catch (error) {
        errorDiv.textContent = 'Gagal menghubungi server';
        errorDiv.style.display = 'block';
      }
    }
  </script>
</body>
</html>
