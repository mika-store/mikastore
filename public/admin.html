<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Mika Store</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="admin-container">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="logo">
        <span>Mika Store</span>
        <small style="display:block;font-size:12px;opacity:0.6;">Admin Panel</small>
      </div>
      <nav class="menu">
        <a href="#" class="active" onclick="loadDashboard()">📊 Dashboard</a>
        <a href="#" onclick="loadProducts()">📦 Produk</a>
        <a href="#" onclick="loadOrders()">📋 Pesanan</a>
        <a href="#" onclick="loadUsers()">👤 Users</a>
        <a href="/" target="_blank">🏪 Lihat Toko</a>
        <a href="#" onclick="logout()" style="color:var(--danger);">🚪 Logout</a>
      </nav>
    </aside>

    <!-- Content -->
    <main class="admin-content">
      <h1 id="adminTitle">Dashboard</h1>
      <div id="adminContent">
        <div class="stats-grid" id="statsGrid">
          <div class="stat-card">
            <div class="label">Total Produk</div>
            <div class="value" id="statProducts">0</div>
          </div>
          <div class="stat-card">
            <div class="label">Total Pesanan</div>
            <div class="value" id="statOrders">0</div>
          </div>
          <div class="stat-card">
            <div class="label">Total User</div>
            <div class="value" id="statUsers">0</div>
          </div>
          <div class="stat-card">
            <div class="label">Pendapatan</div>
            <div class="value" id="statRevenue">Rp 0</div>
          </div>
        </div>
        <div class="card">
          <h3>📋 Pesanan Terbaru</h3>
          <div id="recentOrders">
            <p style="color:var(--gray);">Loading...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/admin.js"></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
