<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - Mika Store</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container" style="max-width:400px;margin:60px auto;">
    <div class="card">
      <h2 style="text-align:center;margin-bottom:24px;">📝 Daftar Akun</h2>
      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Username <span class="required">*</span></label>
          <input type="text" id="username" class="form-control" placeholder="username" required minlength="3">
        </div>
        <div class="form-group">
          <label>Email <span class="required">*</span></label>
          <input type="email" id="email" class="form-control" placeholder="email@example.com" required>
        </div>
        <div class="form-group">
          <label>Password <span class="required">*</span></label>
          <input type="password" id="password" class="form-control" placeholder="Minimal 8 karakter" required minlength="8">
        </div>
        <div class="form-group">
          <label>Konfirmasi Password <span class="required">*</span></label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Ulangi password" required>
        </div>
        <div id="registerError" style="display:none;color:var(--danger);margin-bottom:12px;"></div>
        <button type="submit" class="btn btn-secondary" style="width:100%;justify-content:center;">Daftar</button>
        <p style="text-align:center;margin-top:16px;color:var(--gray);">
          Sudah punya akun? <a href="/login.html" style="color:var(--primary);font-weight:600;">Login</a>
        </p>
      </form>
    </div>
  </div>

  <script>
    const API_URL = 'https://mika-store-backend.onrender.com/api';

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorDiv = document.getElementById('registerError');
      
      errorDiv.style.display = 'none';
      
      if (password !== confirmPassword) {
        errorDiv.textContent = 'Password dan konfirmasi tidak sama';
        errorDiv.style.display = 'block';
        return;
      }
      
      try {
        const response = await fetch(`${API_URL}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, email, password, confirmPassword })
        });
        
        const data = await response.json();
        
        if (data.status === 'success') {
          window.location.href = '/';
        } else {
          errorDiv.textContent = data.message || data.errors?.map(e => e.message).join(', ') || 'Registrasi gagal';
          errorDiv.style.display = 'block';
        }
      } catch (error) {
        errorDiv.textContent = 'Gagal menghubungi server';
        errorDiv.style.display = 'block';
      }
    }
  </script>
</body>
</html>
